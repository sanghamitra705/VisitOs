<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="vosFavGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10243E"/>
      <stop offset="30%" stopColor="#1769D2"/>
      <stop offset="70%" stopColor="#16A6A1"/>
      <stop offset="100%" stopColor="#27B36A"/>
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="vosShieldBg" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#F3F9FD"/>
    </linearGradient>

    <!-- QR Geometry Gradient -->
    <linearGradient id="vosQrGrad" x1="18" y1="18" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1769D2"/>
      <stop offset="50%" stopColor="#16A6A1"/>
      <stop offset="100%" stopColor="#27B36A"/>
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield Contour -->
  <path 
    d="M32 6 L52 14.5 V31 C52 44 43.5 53.5 32 58 C20.5 53.5 12 44 12 31 V14.5 L32 6 Z" 
    fill="url(#vosShieldBg)" 
    stroke="url(#vosFavGrad)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Security Arc -->
  <path 
    d="M17 32.5 C17 41.5 23.5 48.5 32 52.2 C40.5 48.5 47 41.5 47 32.5" 
    stroke="#16A6A1" 
    stroke-width="1.8" 
    stroke-linecap="round" 
    stroke-dasharray="2 3" 
    opacity="0.45"
  />

  <!-- Minimal QR Geometry Structure (Crisp at 16px/32px) -->
  <!-- Top-Left QR Target -->
  <rect x="20" y="19" width="10" height="10" rx="2" fill="none" stroke="#1769D2" stroke-width="2" />
  <rect x="23" y="22" width="4" height="4" rx="1" fill="#1769D2" />

  <!-- Bottom-Left QR Target -->
  <rect x="20" y="34" width="10" height="10" rx="2" fill="none" stroke="#1769D2" stroke-width="2" />
  <rect x="23" y="37" width="4" height="4" rx="1" fill="#1769D2" />

  <!-- Top-Right QR Cell Matrix -->
  <rect x="35" y="19" width="9" height="9" rx="1.8" fill="none" stroke="#1688E8" stroke-width="1.8" />
  <rect x="37.5" y="21.5" width="4" height="4" rx="0.8" fill="#1688E8" />

  <!-- Center-Right Verification Data Blocks -->
  <rect x="35" y="31" width="4" height="4" rx="1" fill="#16A6A1" />
  <rect x="40.5" y="31" width="3.5" height="3.5" rx="0.8" fill="#1769D2" />
  <rect x="35" y="36.5" width="3.5" height="3.5" rx="0.8" fill="#27B36A" />
  <rect x="40" y="36.5" width="4" height="4" rx="1" fill="#16A6A1" />

  <!-- Visitor Identity Silhouette (Center) -->
  <circle cx="32" cy="27" r="2.8" fill="#10243E" />
  <path d="M28 36 C28 33 29.8 31.8 32 31.8 C34.2 31.8 36 33 36 36 Z" fill="#10243E" />

  <!-- Verification Green Badge with Checkmark (Top Right) -->
  <circle cx="49" cy="14" r="7.5" fill="#27B36A" stroke="#FFFFFF" stroke-width="2" />
  <path d="M45.5 14 L48 16.5 L52.5 11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>